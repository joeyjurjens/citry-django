[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "citry-django-djc"
version = "0.1.0"
description = "Let citry-django read Django's syntax the way django-components does, so tags carrying template source as data work in both."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Joey Jurjens", email = "joeyjurjens@gmail.com" }]
keywords = ["citry", "django", "django-components", "templates", "components"]
dependencies = ["citry-django", "django-components>=0.140"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/joeyjurjens/citry-django"
Issues = "https://github.com/joeyjurjens/citry-django/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/citry_django_djc"]
